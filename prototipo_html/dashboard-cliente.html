<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Cliente - Bio Óleo</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <aside class="menu-lateral">
      <h2>Bio Óleo</h2>

      <nav>
        <a href="dashboard-cliente.html" class="ativo">Início</a>
        <a href="#">Solicitar coleta</a>
        <a href="#">Acompanhar coleta</a>
        <a href="relatorios.html">Relatórios</a>
        <a href="acesso.html">Restrição de acesso</a>
        <a href="perfil.html">Perfil</a>
      </nav>
    </aside>

    <main class="conteudo">
      <h1>Olá, cliente!</h1>
      <p>Juntos por um futuro mais sustentável.</p>

      <section class="resumo">
        <div class="cartao">
          <h3>Próxima coleta</h3>
          <p class="numero">Nenhuma</p>
        </div>

        <div class="cartao">
          <h3>Óleo coletado</h3>
          <p class="numero">0 L</p>
        </div>

        <div class="cartao">
          <h3>Meus pontos</h3>
          <p class="numero">0</p>
        </div>
      </section>

      <div class="botoes">
        <button class="botao-solicitar">Solicitar coleta</button>
        <button class="botao-acompanhar">Acompanhar coleta</button>
      </div>

      <section class="cartao">
        <h2>Últimas coletas</h2>

        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Quantidade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="3" class="vazio">Nenhuma coleta registrada.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
